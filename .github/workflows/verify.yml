name: verify

# Continuous verification for every push to main and every pull request:
# install from the committed lockfile, then typecheck, unit tests, build, and
# the package-manifest invariants. Publishing lives in publish.yml; this
# workflow never needs registry credentials.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only: verification must not be able to mutate the repository.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          # Verification may cache: no artifact is published from this job, and
          # the lockfile pins the exact dependency set.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package manifests
        run: node scripts/check-packages.mjs
